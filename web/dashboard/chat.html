<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>shikA — chat</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#131a22; --panel2:#182029; --line:#243040;
    --text:#e6edf3; --muted:#8b98a5; --accent:#4cc2ff; --ok:#3fb950; --warn:#e3833c;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:14px 20px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--warn);box-shadow:0 0 8px var(--warn)}
  .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  a{color:var(--accent);text-decoration:none;font-size:14px}
  main{flex:1;overflow-y:auto;padding:20px;max-width:820px;width:100%;margin:0 auto}
  .msg{margin:0 0 14px;display:flex;gap:10px}
  .msg .who{font-size:12px;color:var(--muted);width:56px;flex:none;padding-top:3px;text-transform:uppercase;letter-spacing:.4px}
  .bubble{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;white-space:pre-wrap;word-break:break-word;line-height:1.5}
  .msg.user .bubble{background:var(--panel2);border-color:#2b5b73}
  .composer{border-top:1px solid var(--line);padding:14px 20px;display:flex;gap:10px;max-width:820px;width:100%;margin:0 auto}
  textarea{flex:1;resize:none;background:var(--panel);color:var(--text);border:1px solid var(--line);
    border-radius:10px;padding:11px 13px;font-size:15px;font-family:inherit;min-height:46px;max-height:180px}
  button{cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#04121c;
    padding:0 18px;border-radius:10px;font-size:14px;font-weight:700}
  button:disabled{opacity:.5;cursor:default}
  .hint{color:var(--muted);text-align:center;padding:40px;line-height:1.6}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot" id="dot"></span> shikA <span style="color:var(--muted);font-weight:400">chat</span></div>
  <a href="/">← device manager</a>
</header>

<main id="log">
  <div class="hint" id="hint">Talk to your mesh. Messages are answered by the head node's model.<br>
    Nothing here leaves your own devices.</div>
</main>

<form class="composer" id="form">
  <textarea id="input" placeholder="Message… (Enter to send, Shift+Enter for newline)" autofocus></textarea>
  <button id="send" type="submit">Send</button>
</form>

<script>
const $ = (id)=>document.getElementById(id);
const log = $('log');
const messages = []; // OpenAI-style history

async function checkHead(){
  try{
    const r = await fetch('/api/webui'); const j = await r.json();
    $('dot').classList.toggle('on', !!j.ready);
  }catch(e){ $('dot').classList.remove('on'); }
}
checkHead(); setInterval(checkHead, 4000);

function esc(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function addBubble(role, text){
  $('hint')?.remove();
  const el = document.createElement('div');
  el.className = 'msg '+role;
  el.innerHTML = '<div class="who">'+(role==='user'?'you':'shikA')+'</div><div class="bubble"></div>';
  el.querySelector('.bubble').textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el.querySelector('.bubble');
}

async function send(text){
  addBubble('user', text);
  messages.push({role:'user', content:text});
  const out = addBubble('assistant', '');
  $('send').disabled = true;

  try{
    const resp = await fetch('/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({model:'local', stream:true, messages})
    });
    if(!resp.ok){ out.textContent = 'Error: '+(await resp.text()); $('send').disabled=false; return; }

    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let acc = '', buf = '';
    for(;;){
      const {value, done} = await reader.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      const lines = buf.split('\n');
      buf = lines.pop();
      for(const line of lines){
        const t = line.trim();
        if(!t.startsWith('data:')) continue;
        const data = t.slice(5).trim();
        if(data === '[DONE]') continue;
        try{
          const j = JSON.parse(data);
          const delta = j.choices?.[0]?.delta?.content || j.choices?.[0]?.message?.content || '';
          if(delta){ acc += delta; out.textContent = acc; log.scrollTop = log.scrollHeight; }
        }catch(_){ /* ignore keepalive / partial */ }
      }
    }
    messages.push({role:'assistant', content:acc});
  }catch(e){
    out.textContent = 'Error: '+e.message;
  }
  $('send').disabled = false;
}

$('form').addEventListener('submit', (e)=>{
  e.preventDefault();
  const text = $('input').value.trim();
  if(!text) return;
  $('input').value='';
  send(text);
});
$('input').addEventListener('keydown', (e)=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); $('form').requestSubmit(); }
});
</script>
</body>
</html>
