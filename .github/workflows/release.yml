name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Test
        run: go test ./...

      - name: Cross-compile release binaries
        run: make cross VERSION="${GITHUB_REF_NAME}"

      - name: Checksums
        run: cd bin && sha256sum shikad-* > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            bin/shikad-* bin/SHA256SUMS \
            --title "shikA ${GITHUB_REF_NAME}" \
            --generate-notes
