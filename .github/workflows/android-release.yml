name: Android Release

# Builds the shikA APK on every version tag and, when signing secrets are
# configured, signs it and attaches it to that tag's GitHub Release. Runs
# alongside the desktop release workflow (which creates the release); this job
# waits for the release to exist, then uploads the APK to it.
#
# Required repository secrets for a *signed* release (Settings → Secrets):
#   ANDROID_KEYSTORE_BASE64   base64 of your .keystore/.jks  (base64 -w0 my.keystore)
#   ANDROID_KEYSTORE_PASSWORD store password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password
# Without them the APK still builds (unsigned) but is not uploaded.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build native orchestrator binary (libshikad.so)
        run: make android VERSION="${GITHUB_REF_NAME:-dev}"

      - name: Build APK
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          if [ -n "${KS_B64:-}" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/shika.keystore"
            gradle assembleRelease \
              -PRELEASE_STORE_FILE="$RUNNER_TEMP/shika.keystore" \
              -PRELEASE_STORE_PASSWORD="$KS_PASS" \
              -PRELEASE_KEY_ALIAS="$KEY_ALIAS" \
              -PRELEASE_KEY_PASSWORD="$KEY_PASS"
            echo "APK=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "No signing secrets set — building an unsigned APK (won't be uploaded)."
            gradle assembleRelease
            echo "SIGNED=0" >> "$GITHUB_ENV"
          fi

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: shikA-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach signed APK to the release
        if: ${{ env.SIGNED == '1' && startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          # The desktop release workflow creates the release; wait for it.
          for _ in $(seq 1 30); do
            if gh release view "$TAG" >/dev/null 2>&1; then break; fi
            echo "waiting for release $TAG ..."
            sleep 5
          done
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
          cp "$APK" "shikA-${TAG}.apk"
          gh release upload "$TAG" "shikA-${TAG}.apk" --clobber
