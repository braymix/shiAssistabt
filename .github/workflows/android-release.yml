name: Android Release

# Builds the shikA APK on every version tag and, when signing secrets are
# configured, signs it and attaches it to that tag's GitHub Release. Runs
# alongside the desktop release workflow (which creates the release); this job
# waits for the release to exist, then uploads the APK to it.
#
# Required repository secrets for a *signed* release (Settings → Secrets):
#   ANDROID_KEYSTORE_BASE64   base64 of your .keystore/.jks  (base64 -w0 my.keystore)
#   ANDROID_KEYSTORE_PASSWORD store password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password
# Without them the APK still builds (unsigned) but is not uploaded.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release:
        description: "Existing release tag to attach the signed APK to (manual runs)."
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build native orchestrator binary (libshikad.so)
        run: make android VERSION="${GITHUB_REF_NAME:-dev}"

      - name: Build (and sign) APK
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          KS="$RUNNER_TEMP/shika.keystore"
          if [ -n "${KS_B64:-}" ]; then
            # Your own stable key (recommended for updatable installs / Play Store).
            echo "$KS_B64" | base64 -d > "$KS"
            STOREPASS="$KS_PASS"; ALIAS="$KEY_ALIAS"; KEYPASS="$KEY_PASS"
          else
            # No secrets set: generate a throwaway key so the APK is still signed
            # and installable with zero setup. keytool ships with the JDK, so you
            # never have to run it yourself. (Because the key changes each build,
            # updating an installed app means uninstall-first; set the
            # ANDROID_KEYSTORE_* secrets once for a stable key.)
            echo "::notice::No signing secrets found — signing with an auto-generated throwaway key."
            STOREPASS="shika-dev"; ALIAS="shika"; KEYPASS="shika-dev"
            keytool -genkeypair -v -keystore "$KS" -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STOREPASS" -keypass "$KEYPASS" \
              -dname "CN=shikA, OU=shikA, O=shikA, C=US"
          fi
          gradle assembleRelease \
            -PRELEASE_STORE_FILE="$KS" \
            -PRELEASE_STORE_PASSWORD="$STOREPASS" \
            -PRELEASE_KEY_ALIAS="$ALIAS" \
            -PRELEASE_KEY_PASSWORD="$KEYPASS"
          echo "APK=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: shikA-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APK to the release
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # Tag push -> the pushed tag; manual run -> the release input (attaches
          # the APK to an already-published release, e.g. v0.1.0).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          # On a tag push the desktop release workflow creates the release; wait.
          for _ in $(seq 1 30); do
            if gh release view "$TAG" >/dev/null 2>&1; then break; fi
            echo "waiting for release $TAG ..."
            sleep 5
          done
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
          cp "$APK" "shikA-${TAG}.apk"
          gh release upload "$TAG" "shikA-${TAG}.apk" --clobber
          echo "Attached shikA-${TAG}.apk to release $TAG"
